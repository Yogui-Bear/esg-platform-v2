version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: esg_admin
      POSTGRES_PASSWORD: secure_password_2026
      POSTGRES_DB: esg_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://esg_admin:secure_password_2026@db:5432/esg_platform
    depends_on:
      - db

volumes:
  pgdata:
